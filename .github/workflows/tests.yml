name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyflakes
      - name: Pyflakes
        run: python -m pyflakes *.py tests
      - name: Tests
        run: python -m pytest tests -q -k "not isolation"

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build
        shell: powershell
        run: .\packaging\build.ps1 -Python python
      - name: Smoke test
        shell: powershell
        run: |
          $env:VOICELAB_HOME = Join-Path $env:RUNNER_TEMP "voicelab_home"
          .\dist\VoiceLab\VoiceLabSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceLab-windows
          path: dist/VoiceLab-windows.zip
